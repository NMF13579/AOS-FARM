task_id: REPLACE_WITH_TASK_ID
human_execution_authorization:
  authorized: true
  authorized_by: human
  authorization_artifact: REPLACE_WITH_PATH_TO_HUMAN_EXECUTION_AUTHORIZATION
risk_profile:
  value: REPLACE_WITH_HUMAN_ASSIGNED_RISK_PROFILE
  assigned_by: human
branch:
  authorized_branch: REPLACE_WITH_AUTHORIZED_BRANCH
  base_branch: REPLACE_WITH_BASE_BRANCH
scope:
  authorized_files:
    - REPLACE_WITH_AUTHORIZED_FILE_OR_DIRECTORY
  forbidden_files:
    - REPLACE_WITH_FORBIDDEN_FILE_OR_DIRECTORY
  allowed_changes:
    - REPLACE_WITH_ALLOWED_CHANGE
  forbidden_changes:
    - REPLACE_WITH_FORBIDDEN_CHANGE
validation_plan:
  - REPLACE_WITH_VALIDATION_COMMAND_OR_REVIEW
expected_evidence:
  - REPLACE_WITH_EXPECTED_EVIDENCE
execution_boundaries:
  commit_allowed: false
  push_allowed: false
  merge_allowed: false
  release_allowed: false
  next_task_allowed: false
  approval_claim_allowed: false
boundary_notes:
  - Template PASS under precheck is not approval.
  - Template PASS does not authorize commit.
  - Template PASS does not authorize push.
  - Evidence is not approval.
  - Human approval cannot be simulated.
